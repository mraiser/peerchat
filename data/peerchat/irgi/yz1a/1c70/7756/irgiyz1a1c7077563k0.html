<div class='data-control' data-control='app:tokens:{}' hidden></div>

<div class="pc">
  <aside class="pc-side">
    <header class="pc-bar">
      <a class="pc-home" href="../app/index.html" title="All apps" aria-label="All apps">&#8962;</a>
      <span class="pc-title">Peerchat</span>
    </header>
    <div class="pc-list"></div>
    <div class="pc-none" hidden>No peers yet. Connect to one in the <a href="../peer/index.html">Peers</a> app.</div>
  </aside>

  <section class="pc-main">
    <div class="pc-blank">Pick a peer to start chatting.</div>
    <header class="pc-bar pc-head" hidden>
      <button class="pc-back" title="Back to chats" aria-label="Back to chats">&#8249;</button>
      <span class="pc-dot"></span>
      <span class="pc-name"></span>
      <span class="pc-state"></span>
    </header>
    <div class="pc-thread" hidden></div>
    <form class="pc-form" hidden>
      <textarea class="pc-input" rows="1" maxlength="16000" placeholder="Message"></textarea>
      <button class="pc-send" type="submit" disabled>Send</button>
    </form>
  </section>
</div>
